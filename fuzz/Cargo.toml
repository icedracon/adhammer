[package]
name = "adhammer-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Standalone workspace so the nightly/libFuzzer build doesn't perturb the main tree.
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
# windows-sddl and dcerpc were extracted to standalone crates; sddl is fuzzed here via crates.io,
# the dcerpc EPM parsers are fuzzed in the dcerpc repo.
windows-sddl = "0.1"
adhammer-secrets = { path = "../crates/secrets" }
# WS-FUZZ-6 (1.4.9) — parsers touching attacker-controlled bytes.
adhammer-kerberos = { path = "../crates/kerberos" }
adhammer-sysvol = { path = "../crates/sysvol" }
dpapi-offline = "0.1.2"
ntlmssp = "0.1"

[[bin]]
name = "sddl_parse"
path = "fuzz_targets/sddl_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "hive_parse"
path = "fuzz_targets/hive_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pac_credential_info"
path = "fuzz_targets/pac_credential_info.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dpapi_blob"
path = "fuzz_targets/dpapi_blob.rs"
test = false
doc = false
bench = false

[[bin]]
name = "dpapi_masterkey"
path = "fuzz_targets/dpapi_masterkey.rs"
test = false
doc = false
bench = false

# WS-FUZZ-6 (1.4.9) — `pac_parse_full` retired 2026-08-31 after 4 rounds of
# fuzz-found panic-under-abort-profile in picky-krb 0.9.6's AES-CTS-HMAC-
# SHA1 decrypt. The panic sits inside `GenericArray::from_slice` deep in
# picky-krb's own crypto path; our length-lower-bounds catch the obvious
# cases but a further residual class exists that we can't distinguish
# without vendoring picky-krb.
#
# `catch_unwind` around the third-party call doesn't help under fuzz
# builds (cargo-fuzz uses `-C panic=abort`). The `pac_credential_info`
# target STILL exercises the same downstream code path via the outer
# PAC framing walk (which naturally constrains input shape via the
# buffer descriptor bounds), so total coverage stays high; only the
# direct-into-crypto probe is retired.
#
# When picky-krb ships a fix that returns Err instead of panicking on
# malformed AES-CTS ct, restore this target.
#
# [[bin]]
# name = "pac_parse_full"
# path = "fuzz_targets/pac_parse_full.rs"
# test = false
# doc = false
# bench = false

[[bin]]
name = "gpp_cpassword"
path = "fuzz_targets/gpp_cpassword.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gptmpl_parse"
path = "fuzz_targets/gptmpl_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ntlmssp_challenge"
path = "fuzz_targets/ntlmssp_challenge.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ntlmssp_type3"
path = "fuzz_targets/ntlmssp_type3.rs"
test = false
doc = false
bench = false
