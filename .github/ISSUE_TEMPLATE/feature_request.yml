name: Feature request
description: Propose an improvement to ADhammer.
title: "[feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Feature requests are evaluated against ADhammer's evidence-first scope. Large protocol or attack-surface additions should explain the validation plan as well as the implementation idea.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What operator, defender, interoperability, or engineering problem does this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful change and where it fits in the existing architecture.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation plan
      description: Explain how the change can be tested using unit tests, protocol vectors, interoperability checks, or an authorized lab.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This proposal fits Active Directory assessment, supporting protocol infrastructure, reporting, or evidence handling.
          required: true
