name: Bug report
description: Report a reproducible defect in ADhammer.
title: "[bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a defect. For security vulnerabilities in ADhammer itself, use the private reporting process in SECURITY.md instead of a public issue.
  - type: input
    id: version
    attributes:
      label: ADhammer version
      description: Release, crate version, or commit SHA.
      placeholder: v1.5.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - Windows
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the smallest safe reproduction you can provide. Remove credentials, real customer identifiers, and sensitive target data.
      render: shell
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, sanitized output, packet-level observations, or test names that support the report.
  - type: checkboxes
    id: scope
    attributes:
      label: Safety check
      options:
        - label: I removed credentials, secrets, and sensitive target identifiers.
          required: true
        - label: This report concerns software behavior in ADhammer, not a request to operate against an unauthorized target.
          required: true
