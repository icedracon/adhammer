name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/logo.svg'
      - 'docs/banner.svg'
      - 'docs/social-preview.png'
      - 'docs/social-preview.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 pinned
      - name: Stage Pages artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/docs
          cp -R site/. _site/
          cp docs/social-preview.png _site/docs/social-preview.png
          cp docs/social-preview.svg _site/docs/social-preview.svg
          cp docs/logo.svg _site/docs/logo.svg
          cp docs/banner.svg _site/docs/banner.svg
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5 pinned
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3 pinned
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v4 pinned
