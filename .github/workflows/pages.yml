name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/logo.svg'
      - 'docs/banner.svg'
      - 'docs/social-preview.png'
      - 'docs/social-preview.svg'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2 pinned
      - name: Stage Pages artifact
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site/docs
          cp -R site/. _site/
          cp docs/social-preview.png _site/docs/social-preview.png
          cp docs/social-preview.svg _site/docs/social-preview.svg
          cp docs/logo.svg _site/docs/logo.svg
          cp docs/banner.svg _site/docs/banner.svg
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v5 pinned
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v3 pinned
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v4 pinned
