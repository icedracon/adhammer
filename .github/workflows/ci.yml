name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Format + clippy — single-OS gate, cheapest.
  lint:
    name: fmt · clippy (deny warnings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 pinned
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable pinned
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2 pinned
      - name: format check
        run: cargo fmt --all --check
      - name: clippy (deny warnings — enforces CLAUDE.md "zero new warnings")
        run: cargo clippy --workspace --all-targets -- -D warnings

  # Build + test across every platform we ship a release binary for.
  # A red build on any of these three blocks merge to main.
  test:
    name: build · test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 pinned
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable pinned
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2 pinned
      - name: build
        run: cargo build --workspace --release
      - name: check supported feature variants
        shell: bash
        run: |
          cargo check --workspace --locked --no-default-features
          cargo test -p adhammer-collector --locked --no-default-features no_tls_feature_tests
          cargo check -p adhammer --locked --no-default-features --features tls-native
          cargo check -p adhammer --locked --features mssql,gssapi
          cargo test -p adhammer --locked --features mssql rustls_provider_tests
          cargo check -p adhammer-collector --locked --features experimental-gkdi
      - name: test (unit + fuzz-lite parsers)
        run: cargo test --workspace

  # MSRV verification — declared in workspace.package.rust-version. If this
  # breaks, either the code drifted past the claimed MSRV or the manifest is stale.
  msrv:
    name: MSRV verify (rust-version from Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 pinned
      - name: read MSRV
        id: msrv
        run: |
          version=$(grep '^rust-version' Cargo.toml | sed 's/.*"\(.*\)"/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV=$version"
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master pinned
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2 pinned
      - name: build with pinned MSRV
        run: cargo build --workspace --release

  # Fuzz is slow — run it separately on a schedule so PR checks stay fast.
  # Left on push/pull_request too, but continue-on-error so it never blocks merge.
  # 1.4.9 WS-FUZZ-6 — added 6 targets (pac_credential_info, pac_parse_full,
  # dpapi_blob, dpapi_masterkey, gpp_cpassword, gptmpl_parse) on top of the
  # existing 2 (sddl_parse, hive_parse). Total 8.
  fuzz:
    name: cargo-fuzz (nightly, short)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 pinned
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly pinned
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2 pinned
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: fuzz each target briefly
        # pac_parse_full retired 2026-08-31 — see fuzz/Cargo.toml comment.
        # Total 7 targets in scope (sddl_parse, hive_parse, pac_credential_info,
        # dpapi_blob, dpapi_masterkey, gpp_cpassword, gptmpl_parse).
        run: |
          for t in sddl_parse hive_parse pac_credential_info \
                   dpapi_blob dpapi_masterkey gpp_cpassword gptmpl_parse; do
            cargo +nightly fuzz run "$t" -- -max_total_time=60 -rss_limit_mb=4096
          done

  # 1.4.9 WS-CI-HARDEN — verify every crate can be packaged in isolation.
  # This catches release-day regressions (LICENSE-path bugs, missing metadata,
  # circular internal deps) two weeks before a tag is cut, not on tag-cut day.
  # --allow-dirty because CI runs against uncommitted state on PRs.
  package-check:
    name: cargo package (all 12 crates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 pinned
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable pinned
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2 pinned
      - name: cargo package --allow-dirty per crate
        run: |
          set -e
          for c in adhammer-core adhammer-secrets adhammer-ldap adhammer-graph \
                   adhammer-sysvol adhammer-kerberos adhammer-bloodhound \
                   adhammer-checks adhammer-collector adhammer-report \
                   adhammer-sdk adhammer; do
            echo "=== cargo package -p $c ==="
            cargo package -p "$c" --allow-dirty --no-verify
          done

  # 1.4.9 WS-CI-HARDEN — license + source + banned-crate policy from deny.toml.
  # Non-blocking on `warn` (duplicate-versions), blocking on `deny` (unknown
  # source, unlicensed crate). Ignore list for accepted advisories is in
  # deny.toml with rationale.
  cargo-deny:
    name: cargo deny (licenses · sources · bans)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 pinned
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable pinned
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2 pinned
      - name: install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        run: cargo deny check licenses sources bans advisories

  # 1.4.9 Phase-1 gate — docs/VALIDATION.md is the source of truth for what the
  # release supports. README / CHANGELOG / PLAN / VECTORS derive from it, not
  # the other way around. This job fails when a public claim exceeds what the
  # ledger records — "we support X" without a matching row is a bug.
  validation-ledger:
    name: docs/VALIDATION.md is authoritative
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 pinned
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5 pinned
        with:
          python-version: "3.12"
      - name: enforce ledger vs public surfaces
        run: python3 scripts/check_validation_ledger.py
