name: nightly fuzz

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-fuzz
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fuzz:
    name: libFuzzer campaign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2 pinned
      - uses: dtolnay/rust-toolchain@7c8d7d138f5c09cef361f8214cf96882cd029cdb # nightly pinned
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2 pinned
        with:
          workspaces: fuzz -> target
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: run fuzz targets
        shell: bash
        run: |
          set +e
          failed=0
          targets=(
            sddl_parse
            hive_parse
            pac_credential_info
            dpapi_blob
            dpapi_masterkey
            gpp_cpassword
            gptmpl_parse
            ntlmssp_challenge
            ntlmssp_type3
            sanitize_terminal
            scope_hostname
            dns_wire
          )

          for target in "${targets[@]}"; do
            echo "::group::fuzz ${target}"
            cargo +nightly fuzz run "${target}" -- -max_total_time=120 -rss_limit_mb=4096
            rc=$?
            echo "::endgroup::"
            if [ "$rc" -ne 0 ]; then
              echo "::error::fuzz target ${target} exited with ${rc}"
              failed=1
            fi
          done

          exit "$failed"
      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3 pinned
        with:
          name: nightly-fuzz-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30
