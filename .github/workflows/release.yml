name: release

# Cross-compiled release binaries. The default build uses rustls with bundled AWS-LC and no
# system OpenSSL; a fully static x86_64
# Linux binary needs only musl-tools. Push a tag (v1.2.3) or run manually to
# build and attach the assets to the release.
#
# 1.4.8 WS-BINSTALL additions:
# - SHA-256 checksum per binary (attached as `<asset>.sha256`).
# - GitHub OIDC → sigstore attestation (attached as `<asset>.sig` +
#   `<asset>.crt` — free code-transparency proof, verifiable via
#   `cosign verify-blob --certificate-identity ...`).
# - `cargo-deb` produces `adhammer_<version>_amd64.deb` on the linux-gnu leg.
# - `cargo-binstall` metadata is in `cli/Cargo.toml [package.metadata.binstall]`
#   — this workflow's naming (`adhammer-<target><ext>`) matches the `pkg-url`
#   template there. Keep them in lockstep.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # for softprops/action-gh-release
  id-token: write   # for sigstore OIDC-signed attestations
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }   # fully static, drop-anywhere
          - { target: x86_64-unknown-linux-gnu,  os: ubuntu-latest }   # deb source
          - { target: x86_64-pc-windows-msvc,    os: windows-latest }
          - { target: aarch64-apple-darwin,      os: macos-latest }
          - { target: x86_64-apple-darwin,       os: macos-15-intel }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2 pinned
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable pinned
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2 pinned

      # 1.4.9 WS-REPRO — SOURCE_DATE_EPOCH from the tag commit's timestamp.
      # Every rebuild of the same tag on the same runner image + toolchain
      # SHA produces the same output bytes. See docs/REPRODUCIBLE_BUILDS.md
      # for what is and isn't reproducible; the musl target is the "gold"
      # reproducibility profile (no glibc drift).
      - name: derive SOURCE_DATE_EPOCH from tag commit
        shell: bash
        run: |
          epoch=$(git log -1 --format=%ct)
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$epoch (from commit $(git rev-parse HEAD))"

      - name: musl tools
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: fetch (populate cache under --locked)
        # cargo fetch does the only network access this release job needs;
        # after this step the local cache has every dep the lockfile pins,
        # so the subsequent --frozen build never touches the network.
        # Without this step a cold rust-cache (new Cargo.lock hash) turns
        # --frozen into an immediate "no matching package" failure.
        run: cargo fetch --locked --target ${{ matrix.target }}

      - name: build (default features = rustls, no OpenSSL)
        # --locked pins Cargo.lock; --frozen bans network fetches; combined
        # they give bit-identical dep resolution across runs. cargo fetch
        # above pre-populates the cache so --frozen has everything it needs.
        run: cargo build --release --locked --frozen --bin adhammer --target ${{ matrix.target }}

      - name: package binary
        id: pkg
        shell: bash
        run: |
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          asset="adhammer-${{ matrix.target }}${ext}"
          cp "target/${{ matrix.target }}/release/adhammer${ext}" "$asset"
          # SHA-256 checksum (portable, no jq / no python).
          # Use the platform's sha256sum / shasum / certutil — one of them exists everywhere.
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "${asset}.sha256"
          elif command -v shasum >/dev/null; then
            shasum -a 256 "$asset" > "${asset}.sha256"
          elif command -v certutil >/dev/null; then
            certutil -hashfile "$asset" SHA256 | sed -n '2p' | tr -d ' \r' > "${asset}.sha256.raw"
            printf '%s  %s\n' "$(cat "${asset}.sha256.raw")" "$asset" > "${asset}.sha256"
            rm -f "${asset}.sha256.raw"
          else
            echo "no sha256 tool available on runner"; exit 1
          fi
          echo "ASSET=$asset"       >> "$GITHUB_ENV"
          echo "SUM=${asset}.sha256" >> "$GITHUB_ENV"

      - name: cargo-deb (linux-gnu only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          cargo install cargo-deb --locked
          # cargo-deb expects target/release/adhammer (the -p flag + no --target
          # keeps its output path prediction happy).
          cp target/${{ matrix.target }}/release/adhammer target/release/adhammer
          cargo deb -p adhammer --no-build --no-strip
          debfile=$(ls target/debian/adhammer_*_amd64.deb | head -1)
          cp "$debfile" .
          echo "DEB=$(basename "$debfile")" >> "$GITHUB_ENV"
          if command -v sha256sum >/dev/null; then
            sha256sum "$(basename "$debfile")" > "$(basename "$debfile").sha256"
            echo "DEB_SUM=$(basename "$debfile").sha256" >> "$GITHUB_ENV"
          fi

      # 1.4.9 WS-SBOM — CycloneDX JSON per release. Buyers with dependency-
      # tracking systems (Dependency-Track, GitHub Dependency Graph) ingest
      # this to reason about the transitive graph without cloning + resolving
      # Cargo.lock themselves. Linux job only — one SBOM per release,
      # workspace-shape is target-agnostic.
      - name: install cargo-cyclonedx (linux only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        # Pin a known-working release; latest cargo-cyclonedx tightened its
        # arg surface (0.5+ removed --spec-version 1.5 shorthand in favour
        # of --spec 1.5). Pinning removes that moving target.
        run: cargo install cargo-cyclonedx --locked --version '=0.5.7'
      - name: generate SBOM (linux only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        # SBOM generation is optional — the release ships with .sha256 +
        # sigstore attestation either way. Failure here surfaces as a
        # warning, not a release-blocker.
        continue-on-error: true
        run: |
          # cargo-cyclonedx 0.5.x default output is JSON at spec 1.4 which
          # every SBOM tool (Dependency-Track, GitHub Dependency Graph)
          # ingests. Explicit --format json guards against a future default
          # flip.
          cargo cyclonedx --format json || {
            echo "cargo cyclonedx failed — skipping SBOM asset (attested binaries still ship)"
            exit 0
          }
          # cargo-cyclonedx writes per-package files under each crate dir; the
          # top-level workspace one lives at the repo root. Rename + hash.
          version=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          root_bom=$(ls *.cdx.json 2>/dev/null | head -1)
          if [ -z "$root_bom" ]; then
            echo "no root CycloneDX file emitted; scanning subdirs"
            root_bom=$(find . -maxdepth 3 -name '*.cdx.json' | head -1)
          fi
          if [ -n "$root_bom" ]; then
            asset="adhammer_${version}.cdx.json"
            cp "$root_bom" "$asset"
            sha256sum "$asset" > "${asset}.sha256"
            echo "SBOM=$asset" >> "$GITHUB_ENV"
            echo "SBOM_SUM=${asset}.sha256" >> "$GITHUB_ENV"
          fi

      - name: sigstore attestation (all platforms)
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2 pinned
        with:
          subject-path: |
            ${{ env.ASSET }}
            ${{ env.DEB }}

      - name: attach to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2 pinned
        with:
          files: |
            ${{ env.ASSET }}
            ${{ env.SUM }}
            ${{ env.DEB }}
            ${{ env.DEB_SUM }}
            ${{ env.SBOM }}
            ${{ env.SBOM_SUM }}
          # Legacy DCs with SHA-1 LDAPS certs need a native-TLS build from source:
          #   cargo build --release --no-default-features --features tls-native
          body: |
            Static/cross-compiled binaries (rustls with bundled AWS-LC — no system OpenSSL).

            **Install paths:**
            - `cargo binstall adhammer` — picks up the binary matching your target
              from this page (needs `cargo-binstall`; falls through to `cargo install`).
            - Linux .deb: `sudo apt install ./adhammer_<version>_amd64.deb`
            - Direct: download `adhammer-<target>` for your platform.

            **Verification:**
            - SHA-256 sum attached per asset (`<asset>.sha256`).
            - Sigstore attestation via GitHub OIDC — verify with
              `gh attestation verify <asset> --owner icedracon`.

            **Legacy DCs** (SHA-1 LDAPS certs): build from source with
            `--no-default-features --features tls-native`.
