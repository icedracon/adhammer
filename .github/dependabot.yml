version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 4
    commit-message:
      prefix: "deps"
      include: "scope"
    labels:
      - "dependencies"
      - "cargo"
    groups:
      cargo-non-major:
        update-types:
          - "patch"
          - "minor"
    ignore:
      # icedracon ecosystem crates are upgraded deliberately as a tested cascade.
      - dependency-name: "adhammer-*"
      - dependency-name: "dcerpc"
      - dependency-name: "ntlmssp"
      - dependency-name: "smb2-client"
      - dependency-name: "ms-*"
      - dependency-name: "windows-sddl"
      - dependency-name: "ad-acl"
      - dependency-name: "dpapi-*"
      - dependency-name: "ese-parser"
      - dependency-name: "ccache-io"
      - dependency-name: "win32-min"
