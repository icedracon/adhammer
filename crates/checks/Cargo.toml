[package]
name = "adhammer-checks"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ADhammer check engine — Active Directory misconfiguration rules across privileged accounts, trusts, stale objects, and anomalies, tagged with MITRE ATT&CK techniques."
repository.workspace = true

[dependencies]
adhammer-core = { workspace = true }
windows-sddl = { workspace = true }
adhammer-graph = { workspace = true }
# ESC1-15 rule pack — operates on ms-crtd's typed CertTemplate view.
ms-crtd = { workspace = true }
# 1.4.8 WS-SCAN-ONLY-FILTER: warn on unknown check ids passed via --only/--skip
# so a typo prints once and is silently ignored, instead of surprising the operator
# with an unfiltered run.
tracing = { workspace = true }

