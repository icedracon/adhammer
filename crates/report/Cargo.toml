[package]
name = "adhammer-report"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ADhammer reporting — configurable risk scoring to JSON/HTML."
keywords = ["active-directory", "report", "html", "security", "audit"]
categories = ["command-line-utilities", "authentication"]
repository.workspace = true

[dependencies]
adhammer-core = { workspace = true }
adhammer-graph = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# 1.4.7 WS-CLEAN-REPORT: content-hash footer + audit fingerprint on every report,
# so `sha256(report.json)` stamps the report identity for baseline diffing / archive
# search. Matches the version already pinned in `crates/kerberos` and `crates/secrets`.
sha2 = "0.10"

# 1.4.7 WS-CTRLMAP: dev-only reach into the checks registry so the CI gate test in
# `check_meta::ws_ctrlmap_tests` can assert every registered check id has a `CheckMeta`
# entry with a populated `control_areas[]` + `kill_chain_phase`. Not a runtime dep —
# report doesn't consume the checks trait, just the `registry_ids()` list.
[dev-dependencies]
adhammer-checks = { workspace = true }
