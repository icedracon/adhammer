[package]
name = "adhammer-kerberos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ADhammer Kerberos — AS-REP/Kerberoast, S4U/RBCD, Shadow Credentials PKINIT (picky-krb)."
keywords = ["kerberos", "active-directory", "pkinit", "asrep", "pentesting"]
categories = ["cryptography", "authentication"]
repository.workspace = true

[dependencies]
adhammer-core = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
# 1.4.7 (post P2-E): wire narration on Kerberos hot paths at debug/trace level so
# `-vv` and `-vvv` actually emit something meaningful on our own crate. Follows the
# redaction discipline captured in `Redacted<T>` — never log ke/ki/session_key/hash
# bytes, only lengths, sequence numbers, etypes, and identifier strings (user,
# realm, spn — those are already sent over the wire in the clear).
tracing = { workspace = true }
md4 = { workspace = true }
md-5 = { workspace = true }
hmac = { workspace = true }

# MS-PAC marshaling + Golden/Silver ticket forgery primitives were split out into
# their own crate. The adapter in pac.rs re-exports the parse/build/forge API
# and layers the picky-krb Tgt-based decrypt_ticket_pac on top of it.
ms-pac-forge = "0.1.3"

# Kerberos roasting is built on picky-krb (Devolutions pure-Rust ASN.1 + KRB message
# types) — no ASN.1 from scratch.
picky-krb = { workspace = true }
picky-asn1 = { workspace = true }
picky-asn1-der = "0.5"
serde = { workspace = true }
rand = "0.8"
rsa = "0.9"
sha1 = "0.10"
sha2 = { version = "0.10", features = ["oid"] }
picky-asn1-x509 = { version = "0.14", features = ["pkcs7"] }
smb2-client = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
