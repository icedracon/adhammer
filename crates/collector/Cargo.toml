[package]
name = "adhammer-collector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ADhammer LDAP collector — domain + Configuration NC collection over ldap3."
keywords = ["active-directory", "ldap", "collection", "pentesting", "audit"]
categories = ["authentication", "network-programming"]
repository.workspace = true
readme = "README.md"

[features]
default = ["tls-rustls"]
# TLS backend for LDAPS. tls-rustls (default) uses rustls with bundled AWS-LC and no system
# OpenSSL. tls-native (OpenSSL/Schannel) accepts the SHA-1 TLS
# handshake signatures that rustls refuses outright, so it reaches legacy DCs with SHA-1 certs.
# With neither feature, plain ldap:// remains available; the two TLS features are mutually exclusive.
tls-rustls = ["ldap3/tls-rustls-aws-lc-rs"]
tls-native = ["ldap3/tls-native", "dep:native-tls"]
# Optional SASL GSSAPI (Kerberos) bind — signed LDAP over 389 without LDAPS/--insecure,
# via ambient Kerberos (ccache on Unix, SSPI on Windows). Pulls a C dep (breaks static
# musl), so it is off by default.
gssapi = ["ldap3/gssapi"]
# Pre-alpha crypto adapter. Keep out of the default graph until upstream KATs land.
experimental-gkdi = ["dep:ms-gkdi"]

[dependencies]
adhammer-core = { workspace = true }
ldap3 = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "time"] }
smb2-client = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
native-tls = { version = "0.2", optional = true }
# ADCS + optional LAPS/gMSA sources. ms-crtd → typed CertTemplate view over
# pKICertificateTemplate LDAP attrs; ms-gkdi → experimental GKDI L0/L1/L2 tree walk.
ms-crtd = { workspace = true }
ms-gkdi = { workspace = true, optional = true }
