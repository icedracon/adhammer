[package]
name = "adhammer-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ADHammer Core — the AD audit + offensive toolkit as one importable SDK (re-exports the collector, graph, checks, kerberos, ldap, sysvol, bloodhound, secrets, and report subsystems). The CLI is the `adhammer` binary."
keywords = ["active-directory", "audit", "sdk", "pentesting", "kerberos"]
categories = ["authentication", "network-programming"]
repository.workspace = true
readme = "README.md"

[features]
default = ["tls-rustls"]
# TLS backend for LDAPS, forwarded to adhammer-collector (mirrors the CLI):
#   tls-rustls (default) — rustls with bundled AWS-LC; no system OpenSSL.
#   tls-native           — OpenSSL/Schannel; reaches legacy DCs with SHA-1 certs.
#   neither              — plain ldap:// only. The TLS features are mutually exclusive.
tls-rustls = ["adhammer-collector/tls-rustls"]
tls-native = ["adhammer-collector/tls-native"]
gssapi = ["adhammer-collector/gssapi"]

[dependencies]
adhammer-core = { workspace = true }
adhammer-collector = { workspace = true }
adhammer-checks = { workspace = true }
adhammer-graph = { workspace = true }
adhammer-kerberos = { workspace = true }
adhammer-report = { workspace = true }
adhammer-sysvol = { workspace = true }
adhammer-ldap = { workspace = true }
adhammer-bloodhound = { workspace = true }
adhammer-secrets = { workspace = true }
# WS-FOUNDATION-DNS-HANDROLL (1.5.0) — BlackBoxRunner::discover_dns
# surfaces adhammer_collector's async DNS discovery with anyhow errors.
anyhow = { workspace = true }

[dev-dependencies]
# `#[tokio::test]` for the async discover_dns short-circuit test.
tokio = { workspace = true, features = ["rt", "macros"] }
