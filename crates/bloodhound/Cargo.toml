[package]
name = "adhammer-bloodhound"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ADhammer BloodHound export — BloodHound CE v5 ingest JSON (users/computers/groups/domains) + ACE edges."
keywords = ["bloodhound", "active-directory", "graph", "pentesting", "audit"]
categories = ["authentication", "command-line-utilities"]
repository.workspace = true
readme = "README.md"

[dependencies]
adhammer-core = { workspace = true }
windows-sddl = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# 1.5.2 opt-in RustHound-CE collector interop. OFF by default. Enable with
# `--features rusthound-ce` on adhammer-bloodhound. Pulls ldap3/tls-rustls-ring
# via RH-CE's `nogssapi` feature. Not compatible with a build that fixes
# ldap3's TLS backend elsewhere in the graph — see docs/PLAN_1.5.2.md.
rusthound-ce = { workspace = true, optional = true }
ldap3 = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
log = { version = "0.4", optional = true }

[features]
default = []
rusthound-ce = ["dep:rusthound-ce", "dep:ldap3", "dep:tokio", "dep:log"]
