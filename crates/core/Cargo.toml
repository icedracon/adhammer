[package]
name = "adhammer-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ADhammer core model — SID/GUID, AD object snapshot, findings, MITRE mapping."
keywords = ["active-directory", "kerberos", "sid", "pentesting", "security"]
categories = ["authentication", "parser-implementations"]
repository.workspace = true
readme = "README.md"

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
windows-sddl = { workspace = true }
# WS-FOUNDATION-INTEGRATE (1.4.10 foundation) — CIDR types for scope::ScopeTarget::Cidr.
ipnet = { workspace = true, features = ["serde"] }
# WS-ZEROIZE (1.4.9) — Redacted<T> Drop-erases byte-material secrets via
# ZeroizeOnDrop wrapping. Small, no-std-friendly, widely-audited (RustCrypto).
zeroize = ">=1.8, <1.9"

[target.'cfg(windows)'.dependencies]
# Create secret artifacts with a protected owner/system/admin DACL at file-creation time.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
serde_json = { workspace = true }
