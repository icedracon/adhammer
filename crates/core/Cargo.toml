[package]
name = "adhammer-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ADhammer core model — SID/GUID, AD object snapshot, findings, MITRE mapping."
keywords = ["active-directory", "kerberos", "sid", "pentesting", "security"]
categories = ["authentication", "parser-implementations"]
repository.workspace = true

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }
windows-sddl = { workspace = true }
# WS-FOUNDATION-INTEGRATE (1.5.0) — CIDR types for scope::ScopeTarget::Cidr.
ipnet = { workspace = true, features = ["serde"] }
# WS-ZEROIZE (1.4.9) — Redacted<T> Drop-erases byte-material secrets via
# ZeroizeOnDrop wrapping. Small, no-std-friendly, widely-audited (RustCrypto).
zeroize = ">=1.8, <1.9"

[dev-dependencies]
serde_json = { workspace = true }
