# cargo-deny policy for the adhammer workspace.
# Run: cargo deny check
# WS-CI-HARDEN — 1.4.9. Adjust with a rationale in the commit message.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "aarch64-apple-darwin" },
]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories — vulnerability and unmaintained-crate policy.
# ---------------------------------------------------------------------------

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # rsa 0.9.x Marvin attack (RUSTSEC-2023-0071) — no upstream fix exists
    # for any pure-Rust RSA implementation. Rationale in .cargo/audit.toml.
    "RUSTSEC-2023-0071",

    # --- zip 4.6.1 (pulled by rust_xlsxwriter 0.90 for `attack scan --format xlsx`) ---
    # All six advisories below are strictly on the EXTRACTION side
    # (`ZipArchive::extract`, `ZipStreamReader::extract`, AES-decrypt entry read).
    # adhammer only WRITES xlsx-as-zip via rust_xlsxwriter's writer; grep confirms
    # no `ZipArchive`, `ZipStreamReader`, or `zip::read` usage anywhere in the tree.
    # None of these are reachable from adhammer binaries. Drop when rust_xlsxwriter
    # bumps its zip pin to >=9.0.
    "RUSTSEC-2026-0367", # zip: SUID/SGID preservation during extract — write-only, unreachable
    "RUSTSEC-2026-0368", # zip: symlink target outside dest during extract — write-only, unreachable
    "RUSTSEC-2026-0369", # zip: symlink permissions through extracted link — write-only, unreachable
    "RUSTSEC-2026-0429", # zip: symlink declared-size abort during extract — write-only, unreachable
    "RUSTSEC-2026-0545", # zip: AES-encrypted entry read without auth-code check — read-only, unreachable
    "RUSTSEC-2026-0548", # zip: ZipStreamReader local-header vs central-dir name split — read-only, unreachable

    # crypto-bigint 0.5.5 timing variability in constant-time ops
    # (RUSTSEC-2026-0387) — reached only through ldap3 → sspi → picky → ecdsa for
    # SASL/NTLM cert-chain and DH ops. Fix is crypto-bigint 0.7.6 which requires
    # sspi/picky to bump their RustCrypto stack. Practical impact bounded (on-prem
    # auditor binding to the DC over the same L2 segment, not a web-exposed TLS
    # terminator). Drop when sspi ships a crypto-bigint 0.7.x line.
    "RUSTSEC-2026-0387",

    # pin-utils 0.1.0 unmaintained (RUSTSEC-2026-0441) — not a vulnerability,
    # just the upstream repository was archived 2026-10-01. Reached only through
    # sspi → async-dnssd. Drop when async-dnssd or sspi replaces `pin_mut!` with
    # `core::pin::pin!` (available since Rust 1.68).
    "RUSTSEC-2026-0441",
]

# ---------------------------------------------------------------------------
# Licenses — allow-list only.
# ---------------------------------------------------------------------------

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "CC0-1.0",
    "MIT-0",
    # zlib-rs 0.6+ (flate2's pure-Rust zlib backend; also pulled by rust_xlsxwriter's zip dep).
    # OSI-approved, FSF Free/Libre, permissive — compatible with the rest of the tree.
    "Zlib",
]
exceptions = []

# ---------------------------------------------------------------------------
# Bans — duplicate-version and denied-crate policy.
# ---------------------------------------------------------------------------

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

allow = []
deny = [
    # Add here as needed. Nothing banned outright yet.
]

# Known-duplicate versions we accept for now (transitive-only).
skip = [
    { name = "getrandom" },        # 0.2 / 0.4 across the rand/aead ecosystem
    { name = "syn" },              # proc-macro-only, doesn't ship in binary
    { name = "thiserror" },        # 1.x / 2.x transitive coexist
    { name = "thiserror-impl" },   # proc-macro companion follows thiserror 1.x / 2.x
    { name = "windows-sys" },      # proc-macro build only
]
skip-tree = []

# ---------------------------------------------------------------------------
# Sources — only crates.io + our own git deps.
# ---------------------------------------------------------------------------

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
