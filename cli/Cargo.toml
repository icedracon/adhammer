[package]
name = "adhammer"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true

[[bin]]
name = "adhammer"
path = "src/main.rs"

[features]
default = ["tls-rustls"]
# TLS backend for LDAPS (forwarded to adhammer-collector):
#   tls-rustls (default) — pure-Rust, static/musl, cross-compiles with no OpenSSL.
#   tls-native           — OpenSSL/Schannel; reaches legacy DCs with SHA-1 certs.
# Legacy build:  cargo build --release --no-default-features --features tls-native
tls-rustls = ["adhammer-collector/tls-rustls"]
tls-native = ["adhammer-collector/tls-native"]
gssapi = ["adhammer-collector/gssapi"]

[dependencies]
adhammer-core = { workspace = true }
windows-sddl = { workspace = true }
adhammer-collector = { workspace = true }
adhammer-checks = { workspace = true }
adhammer-graph = { workspace = true }
adhammer-report = { workspace = true }
adhammer-kerberos = { workspace = true }
adhammer-sysvol = { workspace = true }
smb2-client = { workspace = true }
adhammer-ldap = { workspace = true }
dcerpc = { workspace = true }
ms-drsr = "0.1"
dpapi-ng = { version = "0.1", features = ["rpc"] }
# ESC1-15 static analysis (`check adcs`) + certipy-style CSR construction
# (`attack certipy`) + LAPS-v2 / gMSA seed-key derivation (`dump laps`/`dump gmsa`).
ms-crtd = { workspace = true }
ms-icpr = { workspace = true }
ms-gkdi = { workspace = true }
# ms-icpr's build_csr_with_upn_san signs with an RSA key; `attack certipy`
# generates a fresh 2048-bit key when the caller doesn't supply one.
rsa = { version = "0.9", features = ["sha2", "pem"] }
rand = "0.8"

# ESC8 (adcs-http relay) — minimal NTLM-over-HTTP client. Same rustls/tokio-rustls versions
# ldap3 already pulls in, so no duplicate-crate risk.
tokio-rustls = "0.24"
rustls = "0.21"
rustls-native-certs = "0.6"
adhammer-bloodhound = { workspace = true }
adhammer-secrets = { workspace = true }
ntlmssp = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dialoguer = "0.11"
