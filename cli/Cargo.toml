[package]
name = "adhammer"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "../README.md"
homepage = "https://github.com/icedracon/adhammer"
documentation = "https://docs.rs/adhammer"
keywords = ["active-directory", "kerberos", "pentesting", "bloodhound", "adcs"]
categories = ["command-line-utilities", "authentication", "cryptography", "network-programming"]

[[bin]]
name = "adhammer"
path = "src/main.rs"

# 1.4.8 WS-BINSTALL: point cargo-binstall at the raw binary attachments on the
# GitHub Release page so `cargo binstall adhammer` skips the local rustc compile
# entirely. Naming matches the current release.yml step
# (`adhammer-<target><ext>`); if that filename ever changes, update `pkg-url`
# in lockstep or downstream `cargo binstall` breaks silently.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/adhammer-{ target }{ archive-suffix }"
pkg-fmt = "bin"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "bin"

# 1.4.8 WS-DEB-PACKAGE: `cargo deb -p adhammer` on the linux-gnu build produces
# `adhammer_<version>_amd64.deb` — the release.yml step attaches it to the
# GitHub Release. Users then either add the icedracon APT repo (1.4.9) or run
# `sudo apt install ./adhammer_1.4.8_amd64.deb` for a proper package they can
# `apt remove` later. Assets = the compiled binary + docs; no systemd unit
# (adhammer is a CLI tool, not a daemon).
[package.metadata.deb]
maintainer = "icedracon <adhammer@icedracon.com>"
copyright = "2026, icedracon"
license-file = ["../LICENSE-MIT", "0"]
extended-description = """
Passive Active Directory security assessment with a from-scratch Rust
protocol stack. Runs LDAP collection, control-path graph construction,
scored security checks, MITRE ATT&CK-tagged reports, and BloodHound-CE
ingest export from a single static binary — no Python runtime, no sidecar
services. See https://github.com/icedracon/adhammer .
"""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
    ["target/release/adhammer", "usr/bin/", "755"],
    ["../README.md", "usr/share/doc/adhammer/README.md", "644"],
    ["../CHANGELOG.md", "usr/share/doc/adhammer/CHANGELOG.md", "644"],
    ["../LICENSE-MIT", "usr/share/doc/adhammer/LICENSE-MIT", "644"],
]

[features]
default = ["tls-rustls"]
# TLS backend for LDAPS (forwarded to adhammer-collector):
#   tls-rustls (default) — pure-Rust, static/musl, cross-compiles with no OpenSSL.
#   tls-native           — OpenSSL/Schannel; reaches legacy DCs with SHA-1 certs.
# Legacy build:  cargo build --release --no-default-features --features tls-native
tls-rustls = ["adhammer-collector/tls-rustls"]
tls-native = ["adhammer-collector/tls-native"]
gssapi = ["adhammer-collector/gssapi"]

[dependencies]
adhammer-core = { workspace = true }
windows-sddl = { workspace = true }
adhammer-collector = { workspace = true }
adhammer-checks = { workspace = true }
adhammer-graph = { workspace = true }
adhammer-report = { workspace = true }
adhammer-kerberos = { workspace = true }
adhammer-sysvol = { workspace = true }
smb2-client = { workspace = true }
adhammer-ldap = { workspace = true }
dcerpc = { workspace = true }
ms-drsr = "0.2"
dpapi-ng = { version = "0.1", features = ["rpc"] }
dpapi-offline = { workspace = true }
# ESC1-15 static analysis (`check adcs`) + MS-ICPR CSR construction
# (`attack icpr-esc1`) + LAPS-v2 / gMSA seed-key derivation (`dump laps`/`dump gmsa`).
ms-crtd = { workspace = true }
ms-icpr = { workspace = true }
ms-gkdi = { workspace = true }
ms-tds = { workspace = true }
# ms-icpr's build_csr_with_upn_san signs with an RSA key; `attack icpr-esc1`
# generates a fresh 2048-bit key when the caller doesn't supply one.
rsa = { version = "0.9", features = ["sha2", "pem"] }
rand = "0.8"

# ESC8 (adcs-http relay) — minimal NTLM-over-HTTP client. Same rustls/tokio-rustls versions
# ldap3 already pulls in, so no duplicate-crate risk.
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws-lc-rs"] }
rustls-native-certs = "0.8"
rustls-pemfile = "2"
adhammer-bloodhound = { workspace = true }
adhammer-secrets = { workspace = true }
ntlmssp = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dialoguer = "0.11"
