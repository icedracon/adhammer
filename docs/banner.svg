<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <!--
    ADhammer README banner — 1200×400, blue-cyan single-hue.
    Palette + typography match https://icedracon.github.io/adhammer/
    (accent #2ea8ff on near-black #05070d, Manrope + IBM Plex Mono).
  -->
  <defs>
    <radialGradient id="bnr-bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" style="stop-color:#0a1626"/>
      <stop offset="70%" style="stop-color:#06101c"/>
      <stop offset="100%" style="stop-color:#05070d"/>
    </radialGradient>
    <linearGradient id="bnr-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8fd4ff"/>
      <stop offset="50%" style="stop-color:#2ea8ff"/>
      <stop offset="100%" style="stop-color:#0a3d80"/>
    </linearGradient>
    <linearGradient id="bnr-sep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2ea8ff;stop-opacity:0.15"/>
      <stop offset="50%" style="stop-color:#2ea8ff;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#2ea8ff;stop-opacity:0.15"/>
    </linearGradient>
    <filter id="bnr-glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#bnr-bg)"/>

  <!-- Faint grid. -->
  <g opacity="0.08" stroke="#2ea8ff" stroke-width="1" fill="none">
    <path d="M 0 100 L 1200 100 M 0 200 L 1200 200 M 0 300 L 1200 300"/>
    <path d="M 200 0 L 200 400 M 400 0 L 400 400 M 600 0 L 600 400 M 800 0 L 800 400 M 1000 0 L 1000 400"/>
  </g>

  <!-- Left decorative bracket. -->
  <g stroke="#2ea8ff" stroke-width="2" fill="none" opacity="0.5">
    <path d="M 60 60 L 60 100 M 60 60 L 100 60"/>
    <path d="M 60 340 L 60 300 M 60 340 L 100 340"/>
  </g>
  <!-- Right decorative bracket. -->
  <g stroke="#2ea8ff" stroke-width="2" fill="none" opacity="0.5">
    <path d="M 1140 60 L 1140 100 M 1140 60 L 1100 60"/>
    <path d="M 1140 340 L 1140 300 M 1140 340 L 1100 340"/>
  </g>

  <!-- Wordmark AD // HAMMER (visual '//' separator matches site). -->
  <g filter="url(#bnr-glow)">
    <text x="600" y="215" text-anchor="middle"
          font-family="Manrope, 'Segoe UI', Inter, system-ui, sans-serif"
          font-weight="800"
          font-size="118"
          letter-spacing="6"
          fill="url(#bnr-accent)">AD<tspan fill="#2ea8ff" font-weight="300" opacity="0.55">//</tspan>HAMMER</text>
  </g>

  <!-- Underline stroke — echoes site's evidence/trace metaphor. -->
  <line x1="380" y1="248" x2="820" y2="248" stroke="url(#bnr-sep)" stroke-width="1.5"/>

  <!-- Tagline. -->
  <text x="600" y="295" text-anchor="middle"
        font-family="Manrope, 'Segoe UI', Inter, system-ui, sans-serif"
        font-weight="500"
        font-size="26"
        letter-spacing="1"
        fill="#e6f2ff"
        opacity="0.88">Collect the directory. Validate supported paths.</text>

  <!-- Sub-caption. -->
  <text x="600" y="335" text-anchor="middle"
        font-family="'IBM Plex Mono', 'Courier New', ui-monospace, monospace"
        font-size="14"
        letter-spacing="4"
        fill="#2ea8ff"
        opacity="0.7">ONE BINARY · EVIDENCE-FIRST REPORTS · RUST PROTOCOL CRATES</text>
</svg>
