<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">AD//HAMMER</title>
  <desc id="desc">ADhammer: collect the directory and validate supported attack paths with evidence-first reports.</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1f1ef"/>
      <stop offset="0.5" stop-color="#a7abad"/>
      <stop offset="1" stop-color="#4b5054"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3838"/>
      <stop offset="1" stop-color="#9d090d"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#a00d14" stroke-opacity=".22"/>
      <path d="M40 0V80M0 40H80" stroke="#fff" stroke-opacity=".018"/>
    </pattern>
    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 7.5H8" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="#020304"/>
  <rect x="18" y="18" width="1164" height="364" fill="#090b0e" stroke="#292d31" stroke-width="3"/>
  <rect x="20" y="20" width="1160" height="360" fill="url(#grid)"/>
  <g fill="none" stroke="#e21a20" stroke-width="3">
    <path d="M42 72V42H72M1128 42H1158V72M42 328V358H72M1128 358H1158V328"/>
  </g>
  <g fill="none" stroke="#9d1117" stroke-width="2" opacity=".52">
    <circle cx="1034" cy="201" r="135"/>
    <circle cx="1034" cy="201" r="100" stroke-dasharray="3 12"/>
    <path d="M1034 48V354M881 201H1187"/>
  </g>

  <!-- Compact hammer mark for the left rail. -->
  <g transform="translate(70 116)">
    <path d="M0 0C0-26 21-42 47-42H106V-9H55C43-9 38-1 36 13L33 31H0V0Z" fill="url(#steel)" stroke="#e2e4e4" stroke-width="3"/>
    <path d="M106-42H145V31H106Z" fill="url(#steel)" stroke="#e2e4e4" stroke-width="3"/>
    <path d="M18 143L58 45H83L123 143H99L91 123H50L42 143H18ZM58 103H83L70 70Z" fill="url(#red)" stroke="#ff4040" stroke-width="2"/>
    <path d="M91 45H113C132 45 143 57 143 75V113C143 131 132 143 113 143H91V119H109C115 119 119 115 119 109V79C119 73 115 69 109 69H91Z" fill="#bc1117" stroke="#ff4040" stroke-width="2"/>
  </g>

  <text x="270" y="186" font-family="Arial Black, Impact, sans-serif" font-size="108" font-weight="900" letter-spacing="1" fill="url(#steel)">AD</text>
  <text x="438" y="186" font-family="Arial Black, Impact, sans-serif" font-size="108" font-weight="900" letter-spacing="1" fill="#ed1b24">//</text>
  <text x="568" y="186" font-family="Arial Black, Impact, sans-serif" font-size="108" font-weight="900" letter-spacing="1" fill="url(#red)">HAMMER</text>
  <path d="M270 211H1118" stroke="#d51a20" stroke-width="2" opacity=".72"/>
  <text x="272" y="253" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2" fill="#f0f0ed">COLLECT THE DIRECTORY.</text>
  <text x="690" y="253" font-family="Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="2" fill="#ef2329">VALIDATE SUPPORTED PATHS.</text>
  <text x="274" y="296" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="4" fill="#c7c9c8">ONE BINARY  /  EVIDENCE-FIRST REPORTS  /  RUST PROTOCOL CRATES</text>
  <text x="274" y="337" font-family="Consolas, 'Courier New', monospace" font-size="14" letter-spacing="3" fill="#ef2329">ADHAMMER.EXE  &gt;  SEE THE DOMAIN. UNDERSTAND THE PROOF.</text>
  <rect x="18" y="18" width="1164" height="364" fill="url(#scanlines)"/>
</svg>
