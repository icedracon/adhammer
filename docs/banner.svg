<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <style>
      .bg { fill: #05070d; }
      .panel { fill: #0a1018; }
      .grid { fill: none; stroke: #12304b; stroke-width: 1; opacity: 0.26; }
      .frame { fill: none; stroke: #3db2ff; stroke-width: 2; stroke-linecap: square; }
      .mark { fill: none; stroke: #3db2ff; stroke-width: 8; stroke-linecap: square; stroke-linejoin: miter; }
      .word { fill: #dcecff; font-family: 'IBM Plex Mono', 'Courier New', monospace; font-size: 92px; letter-spacing: 6px; font-weight: 700; }
      .slash { fill: #3db2ff; }
      .tag { fill: #86cfff; font-family: 'IBM Plex Mono', 'Courier New', monospace; font-size: 22px; letter-spacing: 3px; }
      .sub { fill: #3db2ff; font-family: 'IBM Plex Mono', 'Courier New', monospace; font-size: 14px; letter-spacing: 5px; opacity: 0.86; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="400"/>
  <rect class="panel" x="20" y="20" width="1160" height="360"/>

  <g>
    <path class="grid" d="M 20 110 H 1180"/>
    <path class="grid" d="M 20 200 H 1180"/>
    <path class="grid" d="M 20 290 H 1180"/>
    <path class="grid" d="M 220 20 V 380"/>
    <path class="grid" d="M 420 20 V 380"/>
    <path class="grid" d="M 620 20 V 380"/>
    <path class="grid" d="M 820 20 V 380"/>
    <path class="grid" d="M 1020 20 V 380"/>
  </g>

  <g opacity="0.92">
    <path class="frame" d="M 64 64 H 102 M 64 64 V 102"/>
    <path class="frame" d="M 1136 64 H 1098 M 1136 64 V 102"/>
    <path class="frame" d="M 64 336 H 102 M 64 336 V 298"/>
    <path class="frame" d="M 1136 336 H 1098 M 1136 336 V 298"/>
  </g>

  <g transform="translate(180 122)">
    <path class="mark" d="M 0 0 H 92 V 40 H 0 Z"/>
    <path class="mark" d="M 46 52 V 116"/>
    <path class="mark" d="M -18 -18 L 0 0"/>
    <path class="mark" d="M 92 0 L 112 -20"/>
  </g>

  <text class="word" x="314" y="188">AD<tspan class="slash">//</tspan>HAMMER</text>
  <text class="tag" x="314" y="244">active directory assessment</text>
  <text class="sub" x="314" y="292">COLLECT · TRACE · PROVE</text>
</svg>
