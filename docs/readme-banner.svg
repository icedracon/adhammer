<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="title desc">
  <title id="title">ADhammer — evidence-first Active Directory assessment</title>
  <desc id="desc">Charcoal, ivory, and coral typography above a four-stage conceptual workflow: discover, map, validate, report.</desc>
  <rect width="960" height="320" fill="#171d1c"/>
  <path d="M48 45H77" stroke="#f8795b" stroke-width="5"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="92" y="50" fill="#e6ded0" font-size="14" font-weight="700" letter-spacing="2">ACTIVE DIRECTORY / OPEN-SOURCE RUST</text>
    <text x="44" y="156" fill="#f5efe3" font-size="96" font-weight="800" letter-spacing="-5">AD<tspan fill="#f8795b">//</tspan>HAMMER</text>
    <text x="48" y="201" fill="#bfc6bd" font-size="24" letter-spacing="-.3">From directory state to defensible evidence.</text>
    <path d="M48 239H912" stroke="#3d4540"/>
    <g font-size="17" font-weight="700">
      <text x="48" y="283" fill="#f8795b">01</text>
      <text x="82" y="283" fill="#f5efe3">DISCOVER</text>
      <text x="280" y="283" fill="#f8795b">02</text>
      <text x="314" y="283" fill="#f5efe3">MAP</text>
      <text x="508" y="283" fill="#f8795b">03</text>
      <text x="542" y="283" fill="#f5efe3">VALIDATE</text>
      <text x="753" y="283" fill="#f8795b">04</text>
      <text x="787" y="283" fill="#f5efe3">REPORT</text>
    </g>
  </g>
  <g fill="none" stroke="#f8795b" stroke-width="1.5">
    <path d="M226 275H245L240 270M245 275L240 280"/>
    <path d="M453 275H472L467 270M472 275L467 280"/>
    <path d="M698 275H717L712 270M717 275L712 280"/>
  </g>
  <path d="M845 57L881 93L845 129M866 57L902 93L866 129" fill="none" stroke="#b5e8ed" stroke-opacity=".55" stroke-width="2"/>
  <rect y="315" width="960" height="5" fill="#f8795b"/>
</svg>

