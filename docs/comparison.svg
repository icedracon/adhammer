<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <linearGradient id="am-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="100%" style="stop-color:#0d1321"/>
    </linearGradient>
    <linearGradient id="am-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffd5"/>
      <stop offset="100%" style="stop-color:#00b4d8"/>
    </linearGradient>
    <linearGradient id="am-chain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffd5"/>
      <stop offset="55%" style="stop-color:#00b4d8"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <pattern id="am-grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1a2332" stroke-width="0.35"/>
    </pattern>
    <filter id="am-glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="am-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00ffd5"/>
    </marker>
  </defs>

  <rect width="900" height="620" rx="10" fill="url(#am-bg)"/>
  <rect width="900" height="620" rx="10" fill="url(#am-grid)" opacity="0.4"/>

  <!-- Corner brackets -->
  <path d="M 20 20 L 20 48 M 20 20 L 48 20" stroke="#00ffd5" stroke-width="2" fill="none" opacity="0.85"/>
  <path d="M 880 20 L 880 48 M 880 20 L 852 20" stroke="#00ffd5" stroke-width="2" fill="none" opacity="0.85"/>
  <path d="M 20 600 L 20 572 M 20 600 L 48 600" stroke="#7b2ff7" stroke-width="2" fill="none" opacity="0.85"/>
  <path d="M 880 600 L 880 572 M 880 600 L 852 600" stroke="#7b2ff7" stroke-width="2" fill="none" opacity="0.85"/>

  <!-- Header -->
  <text x="450" y="50" text-anchor="middle" font-family="'Courier New', 'Fira Code', monospace" font-size="22" font-weight="bold" fill="#00ffd5" letter-spacing="5" filter="url(#am-glow)">ADHAMMER · OPERATOR MAP</text>
  <text x="450" y="72" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#8892a4" letter-spacing="3">collect → graph → validate supported findings → report</text>

  <!-- Root node -->
  <g font-family="'Courier New', monospace">
    <rect x="380" y="98" width="140" height="42" rx="6" fill="#0f1420" stroke="url(#am-cyan)" stroke-width="1.6"/>
    <text x="450" y="124" text-anchor="middle" font-size="15" font-weight="bold" fill="#00ffd5" letter-spacing="4">ADHAMMER</text>

    <!-- Root → 2 pillars -->
    <line x1="450" y1="140" x2="230" y2="170" stroke="#00ffd5" stroke-width="1.4" opacity="0.7"/>
    <line x1="450" y1="140" x2="670" y2="170" stroke="#7b2ff7" stroke-width="1.4" opacity="0.7"/>

    <!-- Pillar: AUDIT -->
    <rect x="60" y="170" width="340" height="180" rx="8" fill="#0f1420" stroke="#00ffd5" stroke-width="1.3" fill-opacity="0.5" stroke-opacity="0.6"/>
    <text x="80" y="196" font-size="14" font-weight="bold" fill="#00ffd5" letter-spacing="4">▸ AUDIT</text>
    <text x="80" y="218" font-size="11" fill="#e8ecf1">LDAP + SD_FLAGS   ·   low-priv collect</text>
    <text x="80" y="236" font-size="11" fill="#e8ecf1">passive audit coverage across AD posture</text>
    <text x="80" y="254" font-size="11" fill="#e8ecf1">AD CS coverage   ·   DNS   ·   SYSVOL</text>
    <text x="80" y="272" font-size="11" fill="#e8ecf1">trusts · privileged groups · gMSA</text>
    <text x="80" y="290" font-size="11" fill="#e8ecf1">MITRE ATT&amp;CK tag per finding</text>
    <text x="80" y="308" font-size="11" fill="#8892a4">├─ privileged accounts</text>
    <text x="80" y="324" font-size="11" fill="#8892a4">├─ trusts</text>
    <text x="80" y="340" font-size="11" fill="#8892a4">├─ stale objects · anomalies</text>

    <!-- Pillar: ATTACK -->
    <rect x="500" y="170" width="340" height="180" rx="8" fill="#0f1420" stroke="#7b2ff7" stroke-width="1.3" fill-opacity="0.5" stroke-opacity="0.6"/>
    <text x="520" y="196" font-size="14" font-weight="bold" fill="#a259ff" letter-spacing="4">▸ ATTACK</text>
    <text x="520" y="218" font-size="11" fill="#e8ecf1">Kerberos — roast · golden · silver</text>
    <text x="520" y="236" font-size="11" fill="#e8ecf1">PKINIT · S4U · tickets · relay</text>
    <text x="520" y="254" font-size="11" fill="#e8ecf1">DCSync · WMI exec · PtH · asktgt</text>
    <text x="520" y="272" font-size="11" fill="#e8ecf1">AD CS abuse paths and coercion helpers</text>
    <text x="520" y="290" font-size="11" fill="#e8ecf1">RBCD · Shadow Cred · BadSuccessor</text>
    <text x="520" y="308" font-size="11" fill="#8892a4">├─ NTLM relay (SMB · HTTP · certsrv)</text>
    <text x="520" y="324" font-size="11" fill="#8892a4">├─ coerce (RPRN · EFSR · DFSNM)</text>
    <text x="520" y="340" font-size="11" fill="#8892a4">├─ session hunt (SRVSVC · WKSSVC · HKU)</text>

    <!-- 2 pillars → WIRE -->
    <line x1="230" y1="350" x2="450" y2="390" stroke="#00b4d8" stroke-width="1.4" opacity="0.7"/>
    <line x1="670" y1="350" x2="450" y2="390" stroke="#00b4d8" stroke-width="1.4" opacity="0.7"/>

    <!-- WIRE -->
    <rect x="220" y="390" width="460" height="76" rx="8" fill="#0d1a24" stroke="url(#am-chain)" stroke-width="1.4" stroke-opacity="0.85"/>
    <text x="240" y="416" font-size="13" font-weight="bold" fill="#00ffd5" letter-spacing="4">▸ WIRE — from-scratch pure Rust</text>
    <text x="240" y="438" font-size="11" fill="#e8ecf1">DCE/RPC · NDR · NTLM · SMB2 · Kerberos · SASL · SSPI</text>
    <text x="240" y="456" font-size="11" fill="#f7c948">published icedracon crates on crates.io  ·  reusable outside the binary</text>

    <!-- WIRE → REPORT -->
    <line x1="450" y1="466" x2="450" y2="498" stroke="#7b2ff7" stroke-width="1.6" opacity="0.85" marker-end="url(#am-arrow)"/>

    <!-- REPORT -->
    <rect x="220" y="500" width="460" height="60" rx="8" fill="#0f1420" stroke="#7b2ff7" stroke-width="1.3" fill-opacity="0.5" stroke-opacity="0.65"/>
    <text x="240" y="526" font-size="13" font-weight="bold" fill="#a259ff" letter-spacing="4">▸ REPORT</text>
    <text x="240" y="548" font-size="11" fill="#e8ecf1">JSON envelope  ·  HTML  ·  BloodHound-CE bundle  ·  MITRE map</text>

    <!-- Kill-chain footer -->
    <rect x="60" y="578" width="780" height="26" rx="6" fill="#0d1321" stroke="url(#am-chain)" stroke-width="1" stroke-opacity="0.7"/>
    <text x="82" y="596" font-size="10" font-weight="bold" fill="#00ffd5" letter-spacing="2">LAB FLOW</text>
    <text x="180" y="596" font-size="10" fill="#e8ecf1">observe  →  trace  →  validate supported paths  →  capture proof  →</text>
    <text x="720" y="596" font-size="10" font-weight="bold" fill="#f7c948">export report</text>
  </g>
</svg>
