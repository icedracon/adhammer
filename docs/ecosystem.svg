<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <defs>
    <linearGradient id="ec-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="100%" style="stop-color:#0d1321"/>
    </linearGradient>
    <linearGradient id="ec-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffd5"/>
      <stop offset="100%" style="stop-color:#00b4d8"/>
    </linearGradient>
    <linearGradient id="ec-chain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffd5"/>
      <stop offset="55%" style="stop-color:#00b4d8"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <pattern id="ec-grid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1a2332" stroke-width="0.35"/>
    </pattern>
    <filter id="ec-glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="ec-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#00b4d8"/>
    </marker>
  </defs>

  <rect width="1200" height="720" rx="10" fill="url(#ec-bg)"/>
  <rect width="1200" height="720" rx="10" fill="url(#ec-grid)" opacity="0.4"/>

  <!-- Corner brackets -->
  <path d="M 24 24 L 24 56 M 24 24 L 56 24" stroke="#00ffd5" stroke-width="2.2" fill="none" opacity="0.9"/>
  <path d="M 1176 24 L 1176 56 M 1176 24 L 1144 24" stroke="#00ffd5" stroke-width="2.2" fill="none" opacity="0.9"/>
  <path d="M 24 696 L 24 664 M 24 696 L 56 696" stroke="#7b2ff7" stroke-width="2.2" fill="none" opacity="0.9"/>
  <path d="M 1176 696 L 1176 664 M 1176 696 L 1144 696" stroke="#7b2ff7" stroke-width="2.2" fill="none" opacity="0.9"/>

  <!-- Header -->
  <text x="600" y="50" text-anchor="middle" font-family="'Courier New', 'Fira Code', monospace" font-size="20" font-weight="bold" fill="#00ffd5" letter-spacing="5" filter="url(#ec-glow)">ICEDRACON ECOSYSTEM · 61 CRATES</text>
  <text x="600" y="72" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#8892a4" letter-spacing="3">pure-Rust implementations of Microsoft security protocols — cargo add any layer, skip the rest</text>

  <g font-family="'Courier New', monospace">

    <!-- Tier 1 — application node -->
    <rect x="510" y="100" width="180" height="52" rx="8" fill="#0f1420" stroke="url(#ec-cyan)" stroke-width="1.8"/>
    <text x="600" y="126" text-anchor="middle" font-size="17" font-weight="bold" fill="#00ffd5" letter-spacing="5">ADHAMMER</text>
    <text x="600" y="144" text-anchor="middle" font-size="10" fill="#8892a4" letter-spacing="2">application layer</text>

    <!-- Tier 2 — three pillars -->
    <line x1="600" y1="152" x2="290" y2="185" stroke="#00b4d8" stroke-width="1.4" opacity="0.75"/>
    <line x1="600" y1="152" x2="600" y2="185" stroke="#00b4d8" stroke-width="1.4" opacity="0.75"/>
    <line x1="600" y1="152" x2="910" y2="185" stroke="#00b4d8" stroke-width="1.4" opacity="0.75"/>

    <rect x="220" y="185" width="140" height="38" rx="6" fill="#0f1420" stroke="#00ffd5" stroke-width="1.2" fill-opacity="0.5" stroke-opacity="0.7"/>
    <text x="290" y="209" text-anchor="middle" font-size="13" font-weight="bold" fill="#00ffd5" letter-spacing="4">AUDIT</text>

    <rect x="530" y="185" width="140" height="38" rx="6" fill="#0f1420" stroke="#a259ff" stroke-width="1.2" fill-opacity="0.5" stroke-opacity="0.7"/>
    <text x="600" y="209" text-anchor="middle" font-size="13" font-weight="bold" fill="#a259ff" letter-spacing="4">ATTACK</text>

    <rect x="840" y="185" width="140" height="38" rx="6" fill="#0f1420" stroke="#f7c948" stroke-width="1.2" fill-opacity="0.5" stroke-opacity="0.7"/>
    <text x="910" y="209" text-anchor="middle" font-size="13" font-weight="bold" fill="#f7c948" letter-spacing="4">REPORT</text>

    <!-- Convergence lines from pillars to ecosystem bar -->
    <line x1="290" y1="223" x2="600" y2="270" stroke="#00b4d8" stroke-width="1.2" opacity="0.6"/>
    <line x1="600" y1="223" x2="600" y2="270" stroke="#00b4d8" stroke-width="1.2" opacity="0.6"/>
    <line x1="910" y1="223" x2="600" y2="270" stroke="#00b4d8" stroke-width="1.2" opacity="0.6"/>

    <!-- Ecosystem bar -->
    <rect x="140" y="270" width="920" height="60" rx="8" fill="#0d1a24" stroke="url(#ec-chain)" stroke-width="1.5" stroke-opacity="0.9"/>
    <text x="600" y="296" text-anchor="middle" font-size="14" font-weight="bold" fill="#00ffd5" letter-spacing="6">═══  ICEDRACON — PURE-RUST PROTOCOL STACK  ═══</text>
    <text x="600" y="316" text-anchor="middle" font-size="10" fill="#8892a4" letter-spacing="4">every layer is a standalone crate on crates.io — MIT · zero external protocol deps</text>

    <!-- Fan-out from ecosystem bar to 5 category columns -->
    <line x1="600" y1="330" x2="160" y2="380" stroke="#00b4d8" stroke-width="1" opacity="0.55" marker-end="url(#ec-arrow)"/>
    <line x1="600" y1="330" x2="380" y2="380" stroke="#00b4d8" stroke-width="1" opacity="0.55" marker-end="url(#ec-arrow)"/>
    <line x1="600" y1="330" x2="600" y2="380" stroke="#00b4d8" stroke-width="1" opacity="0.55" marker-end="url(#ec-arrow)"/>
    <line x1="600" y1="330" x2="820" y2="380" stroke="#00b4d8" stroke-width="1" opacity="0.55" marker-end="url(#ec-arrow)"/>
    <line x1="600" y1="330" x2="1040" y2="380" stroke="#00b4d8" stroke-width="1" opacity="0.55" marker-end="url(#ec-arrow)"/>

    <!-- Category 1 — TRANSPORT -->
    <rect x="80" y="390" width="160" height="180" rx="6" fill="#0f1420" stroke="#00ffd5" stroke-width="1" fill-opacity="0.45" stroke-opacity="0.55"/>
    <text x="160" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#00ffd5" letter-spacing="3">TRANSPORT</text>
    <line x1="100" y1="424" x2="220" y2="424" stroke="#00ffd5" stroke-width="0.5" opacity="0.5"/>
    <text x="100" y="445" font-size="11" fill="#e8ecf1">dcerpc</text>
    <text x="100" y="465" font-size="11" fill="#e8ecf1">smb2-client</text>
    <text x="100" y="485" font-size="11" fill="#e8ecf1">ms-ndr</text>
    <text x="100" y="505" font-size="11" fill="#e8ecf1">windows-sddl</text>
    <text x="100" y="525" font-size="11" fill="#e8ecf1">windows-sspi-shim</text>
    <text x="100" y="555" font-size="10" fill="#f7c948">+ transports for every</text>
    <text x="100" y="567" font-size="10" fill="#f7c948">sealed named pipe</text>

    <!-- Category 2 — AUTH -->
    <rect x="300" y="390" width="160" height="180" rx="6" fill="#0f1420" stroke="#00ffd5" stroke-width="1" fill-opacity="0.45" stroke-opacity="0.55"/>
    <text x="380" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#00ffd5" letter-spacing="3">AUTH · CRYPTO</text>
    <line x1="320" y1="424" x2="440" y2="424" stroke="#00ffd5" stroke-width="0.5" opacity="0.5"/>
    <text x="320" y="445" font-size="11" fill="#e8ecf1">ntlmssp</text>
    <text x="320" y="465" font-size="11" fill="#e8ecf1">credssp</text>
    <text x="320" y="485" font-size="11" fill="#e8ecf1">dpapi-ng</text>
    <text x="320" y="505" font-size="11" fill="#e8ecf1">dpapi-offline</text>
    <text x="320" y="525" font-size="11" fill="#e8ecf1">ms-gkdi</text>
    <text x="320" y="555" font-size="10" fill="#f7c948">+ LAPS-v2 · gMSA ·</text>
    <text x="320" y="567" font-size="10" fill="#f7c948">DPAPI blob decrypt</text>

    <!-- Category 3 — KERBEROS -->
    <rect x="520" y="390" width="160" height="180" rx="6" fill="#0f1420" stroke="#a259ff" stroke-width="1" fill-opacity="0.45" stroke-opacity="0.55"/>
    <text x="600" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#a259ff" letter-spacing="3">KERBEROS</text>
    <line x1="540" y1="424" x2="660" y2="424" stroke="#a259ff" stroke-width="0.5" opacity="0.5"/>
    <text x="540" y="445" font-size="11" fill="#e8ecf1">ms-pac</text>
    <text x="540" y="465" font-size="11" fill="#e8ecf1">ms-pac-forge</text>
    <text x="540" y="485" font-size="11" fill="#e8ecf1">ms-kile-fast</text>
    <text x="540" y="505" font-size="11" fill="#e8ecf1">ms-pkca</text>
    <text x="540" y="555" font-size="10" fill="#f7c948">+ Golden · Silver ·</text>
    <text x="540" y="567" font-size="10" fill="#f7c948">Diamond · Sapphire</text>

    <!-- Category 4 — DCE/RPC PROTOCOLS -->
    <rect x="740" y="390" width="160" height="180" rx="6" fill="#0f1420" stroke="#00ffd5" stroke-width="1" fill-opacity="0.45" stroke-opacity="0.55"/>
    <text x="820" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#00ffd5" letter-spacing="3">MS-RPC PROTOCOLS</text>
    <line x1="760" y1="424" x2="880" y2="424" stroke="#00ffd5" stroke-width="0.5" opacity="0.5"/>
    <text x="760" y="445" font-size="11" fill="#e8ecf1">ms-drsr</text>
    <text x="760" y="465" font-size="11" fill="#e8ecf1">ms-nrpc</text>
    <text x="760" y="485" font-size="11" fill="#e8ecf1">ms-samr</text>
    <text x="760" y="505" font-size="11" fill="#e8ecf1">ms-lsat · ms-tsch</text>
    <text x="760" y="525" font-size="11" fill="#e8ecf1">ms-even6 · ms-coerce</text>
    <text x="760" y="555" font-size="10" fill="#f7c948">+ DCSync · Zerologon</text>
    <text x="760" y="567" font-size="10" fill="#f7c948">safe-detect · coerce</text>

    <!-- Category 5 — ADCS + RELAY + AUDIT -->
    <rect x="960" y="390" width="160" height="180" rx="6" fill="#0f1420" stroke="#a259ff" stroke-width="1" fill-opacity="0.45" stroke-opacity="0.55"/>
    <text x="1040" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#a259ff" letter-spacing="3">ADCS · RELAY · AUDIT</text>
    <line x1="980" y1="424" x2="1100" y2="424" stroke="#a259ff" stroke-width="0.5" opacity="0.5"/>
    <text x="980" y="445" font-size="11" fill="#e8ecf1">ms-crtd · ms-icpr</text>
    <text x="980" y="465" font-size="11" fill="#e8ecf1">ms-csra</text>
    <text x="980" y="485" font-size="11" fill="#e8ecf1">ntlm-relay</text>
    <text x="980" y="505" font-size="11" fill="#e8ecf1">ad-acl · gpo-forge</text>
    <text x="980" y="525" font-size="11" fill="#e8ecf1">bloodhound-export</text>
    <text x="980" y="555" font-size="10" fill="#f7c948">+ ESC1-15 · ESC8 relay</text>
    <text x="980" y="567" font-size="10" fill="#f7c948">chain · BH-CE ingest</text>

    <!-- Bottom footer bar -->
    <rect x="80" y="610" width="1040" height="50" rx="8" fill="#0d1321" stroke="url(#ec-chain)" stroke-width="1.2" stroke-opacity="0.85"/>
    <text x="600" y="634" text-anchor="middle" font-size="15" font-weight="bold" fill="#00ffd5" letter-spacing="5">61 CRATES. ONE PROTOCOL ECOSYSTEM.</text>
    <text x="600" y="652" text-anchor="middle" font-size="10" fill="#8892a4" letter-spacing="3">every crate MIT-licensed · every crate ships a "does NOT do" section · every crate `cargo add`-able on its own</text>
  </g>
</svg>
