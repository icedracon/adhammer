<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ADhammer mark</title>
  <desc id="desc">A steel hammer over a red AD monogram on a black operator-style field.</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f4f2"/>
      <stop offset="0.48" stop-color="#9ea3a5"/>
      <stop offset="1" stop-color="#454b50"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff3434"/>
      <stop offset="1" stop-color="#9b0808"/>
    </linearGradient>
    <pattern id="scanlines" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 7.5H8" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="512" height="512" rx="76" fill="#030405"/>
  <rect x="16" y="16" width="480" height="480" rx="62" fill="#090b0e" stroke="#25292d" stroke-width="3"/>
  <g fill="none" stroke="#8f1116" stroke-width="2" opacity=".42">
    <circle cx="256" cy="256" r="184"/>
    <circle cx="256" cy="256" r="154" stroke-dasharray="4 12"/>
    <path d="M256 34V478M34 256H478"/>
  </g>
  <g fill="none" stroke="#e11a20" stroke-width="4">
    <path d="M48 92V48H92M420 48H464V92M48 420V464H92M420 464H464V420"/>
  </g>

  <!-- The monogram is the hammer body: A is the striking face, D is the handle-side mass. -->
  <path d="M115 332L207 126H269L361 332H307L286 283H190L169 332H115ZM210 239H266L238 174L210 239Z" fill="url(#red)" stroke="#ff4545" stroke-width="3"/>
  <path d="M284 153H345C381 153 405 176 405 211V271C405 307 381 332 345 332H284V286H337C349 286 356 278 356 266V216C356 204 349 196 337 196H284V153Z" fill="#bd1117" stroke="#ff4545" stroke-width="3"/>
  <path d="M278 153V332" stroke="#5f080c" stroke-width="8"/>

  <!-- Steel hammer head, physically locking the red AD body into one mark. -->
  <path d="M94 126C94 89 122 66 158 66H315V112H171C157 112 149 119 146 137L140 166H94V126Z" fill="url(#steel)" stroke="#e0e3e3" stroke-width="4"/>
  <path d="M315 66H382V166H315V66Z" fill="url(#steel)" stroke="#e0e3e3" stroke-width="4"/>
  <path d="M124 126H315M124 141H315" stroke="#555b60" stroke-width="3" opacity=".8"/>
  <circle cx="276" cy="89" r="8" fill="#16191b" stroke="#596065" stroke-width="3"/>
  <path d="M382 92V140" stroke="#a10d12" stroke-width="5"/>
  <rect x="16" y="16" width="480" height="480" rx="62" fill="url(#scanlines)"/>
</svg>
