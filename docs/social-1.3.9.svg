<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="100%" style="stop-color:#0d1321"/>
    </linearGradient>
    <linearGradient id="sk-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffd5"/>
      <stop offset="100%" style="stop-color:#00b4d8"/>
    </linearGradient>
    <linearGradient id="sk-chain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00ffd5"/>
      <stop offset="55%" style="stop-color:#00b4d8"/>
      <stop offset="100%" style="stop-color:#7b2ff7"/>
    </linearGradient>
    <pattern id="sk-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1a2332" stroke-width="0.35"/>
    </pattern>
    <filter id="sk-glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#sk-bg)"/>
  <rect width="1200" height="630" fill="url(#sk-grid)" opacity="0.4"/>

  <!-- Corner brackets -->
  <path d="M 32 32 L 32 66 M 32 32 L 66 32" stroke="#00ffd5" stroke-width="2.2" fill="none" opacity="0.9"/>
  <path d="M 1168 32 L 1168 66 M 1168 32 L 1134 32" stroke="#00ffd5" stroke-width="2.2" fill="none" opacity="0.9"/>
  <path d="M 32 598 L 32 564 M 32 598 L 66 598" stroke="#7b2ff7" stroke-width="2.2" fill="none" opacity="0.9"/>
  <path d="M 1168 598 L 1168 564 M 1168 598 L 1134 598" stroke="#7b2ff7" stroke-width="2.2" fill="none" opacity="0.9"/>

  <!-- Small hex logo mark, top-left -->
  <g transform="translate(90, 90)">
    <polygon points="0,-32 27,-16 27,16 0,32 -27,16 -27,-16" fill="none" stroke="url(#sk-cyan)" stroke-width="2.5" opacity="0.9"/>
    <rect x="-3" y="-16" width="6" height="18" fill="#00ffd5" opacity="0.85"/>
    <rect x="-11" y="-19" width="22" height="7" rx="1.5" fill="#00ffd5" opacity="0.85"/>
    <line x1="-3" y1="2" x2="3" y2="2" stroke="#0a0e17" stroke-width="1.5"/>
  </g>

  <!-- Title block -->
  <text x="150" y="98" font-family="'Courier New', 'Fira Code', monospace" font-size="42" font-weight="bold" fill="#00ffd5" letter-spacing="4" filter="url(#sk-glow)">adhammer 1.3.9</text>
  <text x="150" y="132" font-family="'Courier New', monospace" font-size="15" fill="#8892a4" letter-spacing="3">Active Directory security assessment · pure Rust · one static binary</text>

  <line x1="90" y1="170" x2="1110" y2="170" stroke="url(#sk-chain)" stroke-width="1.4" opacity="0.7"/>

  <!-- 4 feature tiles: 2×2 grid -->
  <g font-family="'Courier New', monospace">

    <!-- Tile 1: Session hunt -->
    <rect x="90" y="200" width="500" height="130" rx="8" fill="#0f1420" stroke="#00ffd5" stroke-width="1.2" fill-opacity="0.5" stroke-opacity="0.55"/>
    <text x="112" y="230" font-size="15" font-weight="bold" fill="#00ffd5" letter-spacing="3">▸ SESSION HUNT — three angles</text>
    <text x="112" y="256" font-size="14" fill="#e8ecf1">enum sessions   SRVSVC NetrSessionEnum</text>
    <text x="112" y="278" font-size="14" fill="#e8ecf1">enum wkssvc     WKSSVC NetrWkstaUserEnum</text>
    <text x="112" y="300" font-size="14" fill="#e8ecf1">enum hku        MS-RRP HKU walk (no admin)</text>
    <text x="112" y="320" font-size="12" fill="#f7c948">dedup + machine filter on by default</text>

    <!-- Tile 2: JSON envelope -->
    <rect x="610" y="200" width="500" height="130" rx="8" fill="#0f1420" stroke="#7b2ff7" stroke-width="1.2" fill-opacity="0.5" stroke-opacity="0.55"/>
    <text x="632" y="230" font-size="15" font-weight="bold" fill="#a259ff" letter-spacing="3">▸ --json ENVELOPE</text>
    <text x="632" y="256" font-size="14" fill="#e8ecf1">AttackResult wrapper on every subcommand</text>
    <text x="632" y="278" font-size="14" fill="#e8ecf1">pipe cleanly into jq or CI</text>
    <text x="632" y="300" font-size="14" fill="#e8ecf1">sessions cached DPAPI-encrypted at rest</text>
    <text x="632" y="320" font-size="12" fill="#f7c948">--old skips the credential wizard</text>

    <!-- Tile 3: ESC scan pack -->
    <rect x="90" y="350" width="500" height="130" rx="8" fill="#0f1420" stroke="#7b2ff7" stroke-width="1.2" fill-opacity="0.5" stroke-opacity="0.55"/>
    <text x="112" y="380" font-size="15" font-weight="bold" fill="#a259ff" letter-spacing="3">▸ ADCS SCAN PACK</text>
    <text x="112" y="406" font-size="14" fill="#e8ecf1">ESC6 / 7 / 8 / 10 / 11 / 16 wired to scan</text>
    <text x="112" y="428" font-size="14" fill="#e8ecf1">MS-RRP registry probes for CA + DC config</text>
    <text x="112" y="450" font-size="14" fill="#e8ecf1">HTTP probe for ESC8 web enrollment</text>
    <text x="112" y="470" font-size="12" fill="#f7c948">plus offline ESC1-15 rule pack</text>

    <!-- Tile 4: Wire hardening -->
    <rect x="610" y="350" width="500" height="130" rx="8" fill="#0f1420" stroke="#00ffd5" stroke-width="1.2" fill-opacity="0.5" stroke-opacity="0.55"/>
    <text x="632" y="380" font-size="15" font-weight="bold" fill="#00ffd5" letter-spacing="3">▸ WIRE — dcerpc 0.2.5</text>
    <text x="632" y="406" font-size="14" fill="#e8ecf1">bounded-alloc preflight — srvsvc + rrp + wkssvc</text>
    <text x="632" y="428" font-size="14" fill="#e8ecf1">no more Vec::with_capacity(u32::MAX) → OOM</text>
    <text x="632" y="450" font-size="14" fill="#e8ecf1">regression tests + live-validated on 2022 + 2025</text>
    <text x="632" y="470" font-size="12" fill="#f7c948">61 icedracon crates · 18k downloads</text>

    <!-- Bottom credit banner -->
    <rect x="90" y="510" width="1020" height="58" rx="8" fill="#0d1321" stroke="url(#sk-chain)" stroke-width="1.3" stroke-opacity="0.85"/>
    <text x="115" y="535" font-size="13" font-weight="bold" fill="#00ffd5" letter-spacing="2">CREDIT</text>
    <text x="205" y="535" font-size="13" fill="#e8ecf1">wkssvc + rrp OpenHKU/logged_on_sids by</text>
    <text x="565" y="535" font-size="13" font-weight="bold" fill="#f7c948">@g0h4n_0</text>
    <text x="640" y="535" font-size="13" fill="#e8ecf1">(Quentin Texier · Red Team Operator @ RandoriSec)</text>
    <text x="115" y="555" font-size="11" fill="#5a6577">github.com/icedracon/adhammer  ·  cargo install adhammer  ·  static binary, Kali or Windows</text>
  </g>
</svg>
