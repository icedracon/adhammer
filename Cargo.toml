[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/collector",
    "crates/checks",
    "crates/graph",
    "crates/kerberos",
    "crates/report",
    "crates/sysvol",
    "crates/ldap",
    "crates/bloodhound",
    "crates/secrets",
    "crates/sdk",
    "cli",
]
# cargo-fuzz targets are their own workspace (nightly + libFuzzer; run on Kali/Linux).
exclude = ["fuzz"]

[workspace.package]
version = "1.5.0"
edition = "2021"
license = "MIT"
authors = ["zevs"]
rust-version = "1.88"
description = "ADhammer — Active Directory security assessment and offensive tradecraft in Rust, with a from-scratch DCE/RPC · NTLM · SMB2 · Kerberos stack."
repository = "https://github.com/icedracon/adhammer"

[workspace.dependencies]
# WS-FOUNDATION-INTEGRATE (1.4.10 foundation, capability in 1.5.0) —
# CIDR + IP-address types for EngagementScope. Small (2 deps, no
# transitive network stack), widely audited. No DNS resolver dep:
# WS-FOUNDATION-DNS-HANDROLL (1.5.1) hand-rolls the SRV lookup per D2
# locked in docs/PLAN_1.5.0.md.
ipnet        = "2.11"
# the from-scratch protocol stack, now consumed as standalone published crates
# (extracted from this repo — https://crates.io/crates/{windows-sddl,ntlmssp,smb2-client,dcerpc})
windows-sddl = "0.1.3"
ad-acl       = "0.1"
ntlmssp      = "0.1.1"
smb2-client  = "0.2"
# dcerpc tracks the git repo until 0.2 is published (it carries the in-development
# RRP / DCOM / Netlogon modules that `enum esc|posture` and `attack zerologon` use).
dcerpc       = "0.2.8"
# ADCS + DPAPI-NG protocol libraries — extracted parsers + CSR builder + LAPS-v2
# tree walk used by `check adcs` (ms-crtd ESC rule pack), `attack icpr-esc1` (ms-icpr),
# and the opt-in collector GKDI adapter. ms-icpr's `network` feature (sealed `\PIPE\cert`
# transport via SMB2 + dcerpc) is ON by default after the dcerpc 0.2.3 cycle fix.
ms-crtd      = "0.1"
ms-icpr      = "0.1.2"
ms-gkdi      = "0.1"
# TDS 7.4 client (MSSQL). Opt-in behind the CLI's `mssql` feature because this
# offline-tested attack path also activates Rustls's ring provider.
ms-tds       = "0.1.1"
# DPAPI offline — parse + decrypt user masterkey files. Used by
# `attack dpapi-master-key` (1.4.8-B WS-DPAPI-MASTER-KEY). 0.1.1 fixes the
# masterkey chain to route through Windows's non-standard PBKDF2 variant
# (byte-oracle-validated on Server 2025); the blob-decrypt path is not yet
# e2e-validated so `attack dpapi-master-key` returns the 64-byte master key
# and leaves blob unwrap for a follow-up verb.
dpapi-offline = "0.1.2"
# internal (version required so crates.io can strip the path on publish)
adhammer-core      = { path = "crates/core",      version = "1.5.0" }
adhammer-collector = { path = "crates/collector", version = "1.5.0", default-features = false }
adhammer-checks    = { path = "crates/checks",    version = "1.5.0" }
adhammer-graph     = { path = "crates/graph",     version = "1.5.0" }
adhammer-kerberos  = { path = "crates/kerberos",  version = "1.5.0" }
adhammer-report    = { path = "crates/report",    version = "1.5.0" }
adhammer-sysvol    = { path = "crates/sysvol",    version = "1.5.0" }
adhammer-ldap      = { path = "crates/ldap",      version = "1.5.0" }
adhammer-bloodhound = { path = "crates/bloodhound", version = "1.5.0" }
adhammer-secrets    = { path = "crates/secrets",    version = "1.5.0" }

# WS-HASHGLASS (1.5.0, LOCAL-ONLY) — pentester-focused hash-type identifier
# consumed by `attack roast` to annotate each emitted hash with its hashcat
# mode + name + confidence. Not on crates.io yet, so path-only for now; a
# published-registry line lands with WS-HASHGLASS-PUBLISH. Version pinned
# even without a registry entry so `cargo deny bans` does not flag this as
# a wildcard dependency (WS-DEPS-BANS discipline).
hashglass = { path = "../hashglass", version = "0.1" }

# external
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
thiserror   = "2"
bitflags    = { version = "2", features = ["serde"] }
tokio       = { version = "1", features = ["rt-multi-thread", "macros"] }
# TLS backend is selected by the adhammer-collector features (rustls with bundled AWS-LC by
# default; tls-native opt-in for SHA-1 legacy-DC LDAPS).
ldap3       = { version = "0.12", default-features = false }
petgraph    = "0.6"
clap        = { version = "4", features = ["derive"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# crypto / kerberos (roasting layer)
picky-krb   = "0.9"
picky-asn1  = "0.10"
md-5        = "0.11"
md4         = "0.10"
hmac        = "0.12"
rc4         = "0.1"
aes         = "0.8"
cbc         = "0.1"
hex         = "0.4"
base64      = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1


# WS-FOUNDATION-NULLBIND (1.5.0, LOCAL-ONLY) — use the local smb2-client
# 0.2.2 that adds `login_null` (anonymous IPC$ session) until 0.2.2 is
# published. MUST be stripped before any adhammer crates.io publish
# (see feedback-adhammer-hard-rules § [patch.crates-io] strip discipline).
[patch.crates-io]
smb2-client = { path = "../smb2-client" }
# WS-BB-SHARES (1.5.0, LOCAL-ONLY) — local dcerpc 0.2.9 adds srvsvc
# `NetrShareEnum` (opnum 15, SHARE_INFO_1) consumed by `enum shares --anon`.
# Strip before any adhammer crates.io publish, same as smb2-client above.
dcerpc = { path = "../dcerpc" }
