[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/collector",
    "crates/checks",
    "crates/graph",
    "crates/kerberos",
    "crates/report",
    "crates/sysvol",
    "crates/ldap",
    "crates/bloodhound",
    "crates/secrets",
    "crates/sdk",
    "cli",
]
# cargo-fuzz targets are their own workspace (nightly + libFuzzer; run on Kali/Linux).
exclude = ["fuzz"]

[workspace.package]
version = "1.4.8"
edition = "2021"
license = "MIT"
authors = ["zevs"]
rust-version = "1.88"
description = "ADhammer — Active Directory security assessment and offensive tradecraft in Rust, with a from-scratch DCE/RPC · NTLM · SMB2 · Kerberos stack."
repository = "https://github.com/icedracon/adhammer"

[workspace.dependencies]
# the from-scratch protocol stack, now consumed as standalone published crates
# (extracted from this repo — https://crates.io/crates/{windows-sddl,ntlmssp,smb2-client,dcerpc})
windows-sddl = "0.1.2"
ad-acl       = "0.1"
ntlmssp      = "0.1"
smb2-client  = "0.2"
# dcerpc tracks the git repo until 0.2 is published (it carries the in-development
# RRP / DCOM / Netlogon modules that `enum esc|posture` and `attack zerologon` use).
dcerpc       = "0.2.8"
# ADCS + DPAPI-NG protocol libraries — extracted parsers + CSR builder + LAPS-v2
# tree walk used by `check adcs` (ms-crtd ESC rule pack), `attack icpr-esc1` (ms-icpr),
# and `dump laps/gmsa` (ms-gkdi). ms-icpr's `network` feature (sealed `\PIPE\cert`
# transport via SMB2 + dcerpc) is ON by default after the dcerpc 0.2.3 cycle fix.
ms-crtd      = "0.1"
ms-icpr      = "0.1.2"
ms-gkdi      = "0.1"
# TDS 7.4 client (MSSQL). Used by `attack mssql` (WS-1, 1.4.1) — xp_cmdshell
# and EXECUTE AS impersonation chains over an NTLM-authenticated session.
ms-tds       = "0.1.1"
# DPAPI offline — parse + decrypt user masterkey files. Used by
# `attack dpapi-master-key` (1.4.8-B WS-DPAPI-MASTER-KEY). 0.1.1 fixes the
# masterkey chain to route through Windows's non-standard PBKDF2 variant
# (byte-oracle-validated on Server 2025); the blob-decrypt path is not yet
# e2e-validated so `attack dpapi-master-key` returns the 64-byte master key
# and leaves blob unwrap for a follow-up verb.
dpapi-offline = "0.1.2"
# internal (version required so crates.io can strip the path on publish)
adhammer-core      = { path = "crates/core",      version = "1.4.8" }
adhammer-collector = { path = "crates/collector", version = "1.4.8", default-features = false }
adhammer-checks    = { path = "crates/checks",    version = "1.4.8" }
adhammer-graph     = { path = "crates/graph",     version = "1.4.8" }
adhammer-kerberos  = { path = "crates/kerberos",  version = "1.4.8" }
adhammer-report    = { path = "crates/report",    version = "1.4.8" }
adhammer-sysvol    = { path = "crates/sysvol",    version = "1.4.8" }
adhammer-ldap      = { path = "crates/ldap",      version = "1.4.8" }
adhammer-bloodhound = { path = "crates/bloodhound", version = "1.4.8" }
adhammer-secrets    = { path = "crates/secrets",    version = "1.4.8" }

# external
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
thiserror   = "2"
bitflags    = { version = "2", features = ["serde"] }
tokio       = { version = "1", features = ["rt-multi-thread", "macros"] }
# TLS backend is selected by the adhammer-collector features (rustls by default → pure-Rust,
# static/musl, trivial cross-compile; tls-native opt-in for SHA-1 legacy-DC LDAPS).
ldap3       = { version = "0.12", default-features = false }
petgraph    = "0.6"
clap        = { version = "4", features = ["derive"] }
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# crypto / kerberos (roasting layer)
picky-krb   = "0.9"
picky-asn1  = "0.10"
md-5        = "0.10"
md4         = "0.10"
hmac        = "0.12"
rc4         = "0.1"
aes         = "0.8"
cbc         = "0.1"
hex         = "0.4"
base64      = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1

# [patch.crates-io] removed 2026-08-27 — dcerpc 0.2.8 shipped to crates.io with the
# Kerberos-sealed-DCE-RPC transport methods + BIND_NAK reason + DC-quirk BIND_ACK
# tolerance. Workspace consumes from crates.io directly now.
