[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/collector",
    "crates/checks",
    "crates/graph",
    "crates/kerberos",
    "crates/report",
    "crates/sysvol",
    "crates/ldap",
    "crates/bloodhound",
    "crates/secrets",
    "crates/sdk",
    "cli",
]
# cargo-fuzz targets are their own workspace (nightly + libFuzzer; run on Kali/Linux).
exclude = ["fuzz"]

[workspace.package]
version = "1.4.0"
edition = "2021"
license = "MIT"
authors = ["zevs"]
rust-version = "1.80"
description = "ADhammer — Active Directory security assessment and offensive tradecraft in Rust, with a from-scratch DCE/RPC · NTLM · SMB2 · Kerberos stack."
repository = "https://github.com/icedracon/adhammer"

[workspace.dependencies]
# the from-scratch protocol stack, now consumed as standalone published crates
# (extracted from this repo — https://crates.io/crates/{windows-sddl,ntlmssp,smb2-client,dcerpc})
windows-sddl = "0.1.1"
ad-acl       = "0.1"
ntlmssp      = "0.1"
smb2-client  = "0.2"
# dcerpc tracks the git repo until 0.2 is published (it carries the in-development
# RRP / DCOM / Netlogon modules that `enum esc|posture` and `attack zerologon` use).
dcerpc       = "0.2"
# ADCS + DPAPI-NG protocol libraries — extracted parsers + CSR builder + LAPS-v2
# tree walk used by `check adcs` (ms-crtd ESC rule pack), `attack certipy` (ms-icpr),
# and `dump laps/gmsa` (ms-gkdi). ms-icpr's `network` feature (sealed `\PIPE\cert`
# transport) is disabled because its dcerpc pull would tug the local dcerpc HEAD
# into the resolve graph and reintroduce the ms-nrpc cycle; the wire path uses
# `ms_icpr::IcprClient::stub` + the offline CSR builder for now.
ms-crtd = "0.1.0"
ms-icpr = { version = "0.1.0", default-features = false }
ms-gkdi = "0.1.0"
# internal (version required so crates.io can strip the path on publish)
adhammer-core      = { path = "crates/core",      version = "1.4.0" }
adhammer-collector = { path = "crates/collector", version = "1.4.0", default-features = false }
adhammer-checks    = { path = "crates/checks",    version = "1.4.0" }
adhammer-graph     = { path = "crates/graph",     version = "1.4.0" }
adhammer-kerberos  = { path = "crates/kerberos",  version = "1.4.0" }
adhammer-report    = { path = "crates/report",    version = "1.4.0" }
adhammer-sysvol    = { path = "crates/sysvol",    version = "1.4.0" }
adhammer-ldap      = { path = "crates/ldap",      version = "1.4.0" }
adhammer-bloodhound = { path = "crates/bloodhound", version = "1.4.0" }
adhammer-secrets    = { path = "crates/secrets",    version = "1.4.0" }

# external
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
anyhow      = "1"
thiserror   = "2"
bitflags    = { version = "2", features = ["serde"] }
tokio       = { version = "1", features = ["rt-multi-thread", "macros"] }
# TLS backend is selected by the adhammer-collector features (rustls by default → pure-Rust,
# static/musl, trivial cross-compile; tls-native opt-in for SHA-1 legacy-DC LDAPS).
ldap3       = { version = "0.11", default-features = false }
petgraph    = "0.6"
clap        = { version = "4", features = ["derive"] }
tracing     = "0.1"
tracing-subscriber = "0.3"

# crypto / kerberos (roasting layer)
picky-krb   = "0.9"
picky-asn1  = "0.10"
md-5        = "0.10"
md4         = "0.10"
hmac        = "0.12"
rc4         = "0.1"
aes         = "0.8"
cbc         = "0.1"
hex         = "0.4"
base64      = "0.22"

[profile.release]
lto = "thin"
codegen-units = 1

# [patch.crates-io] entries removed 2026-08-09: ms-ndr 0.1.0 and smb2-client 0.2.1
# are both published on crates.io, no local patching needed. dcerpc was already
# commented due to the ms-nrpc cycle. If local dev needs sibling repos again, add
# entries back locally but do NOT commit — GitHub runners lack sibling dirs.
# [patch.crates-io]
# ms-ndr = { path = "../ms-ndr" }
# smb2-client = { path = "../smb2-client" }
# dcerpc = { path = "../dcerpc" }
